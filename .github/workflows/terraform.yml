name: Terraform Deploy (Infra + Lambda)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Clone API repo
        run: |
          git clone https://github.com/calabria1/todo-api.git api-src

      # ✅ Debug: mostra estrutura real do repo todo-api
      - name: Debug API repo tree
        run: |
          echo "---- api-src ls ----"
          ls -la api-src
          echo "---- find requirements.txt ----"
          find api-src -maxdepth 5 -name "requirements.txt" -print
          echo "---- find handler.py ----"
          find api-src -maxdepth 8 -name "handler.py" -print

      # ✅ Build genérico: encontra o requirements e o src automaticamente
      - name: Build Lambda zip (auto-detect)
        run: |
          set -euo pipefail

          REQ_FILE="$(find api-src -maxdepth 6 -path "*/services/*/requirements.txt" -print -quit)"
          if [ -z "${REQ_FILE}" ]; then
            echo "Could not find services/*/requirements.txt"
            exit 1
          fi
          echo "Using requirements: ${REQ_FILE}"

          SRC_DIR="$(dirname "${REQ_FILE}")/src"
          if [ ! -d "${SRC_DIR}" ]; then
            echo "Could not find src dir next to requirements: ${SRC_DIR}"
            exit 1
          fi
          echo "Using src dir: ${SRC_DIR}"

          # Descobre o "service name" (ex: tasks) a partir do path services/<name>/requirements.txt
          SERVICE_NAME="$(echo "${REQ_FILE}" | sed -E 's|.*/services/([^/]+)/requirements.txt|\\1|')"
          echo "Service name: ${SERVICE_NAME}"

          python -m pip install --upgrade pip
          rm -rf .build tasks.zip
          mkdir -p .build/${SERVICE_NAME}

          python -m pip install -r "${REQ_FILE}" -t ".build/${SERVICE_NAME}"

          mkdir -p ".build/${SERVICE_NAME}/services/${SERVICE_NAME}/src"
          cp -R "${SRC_DIR}/"* ".build/${SERVICE_NAME}/services/${SERVICE_NAME}/src/"

          (cd ".build/${SERVICE_NAME}" && zip -r "../../tasks.zip" . >/dev/null)
          ls -la tasks.zip

      - name: Upload Lambda artifact to S3 (dev.zip)
        run: |
          aws s3 cp tasks.zip "s3://todo-calabria1-artifacts-123/lambdas/tasks/dev.zip"

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/envs/dev
        run: terraform plan

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: terraform apply -auto-approve
