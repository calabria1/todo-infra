name: Terraform Deploy (Infra + Lambda)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      # 🔎 Descobre onde está o infra/envs/dev (pode ser infra/envs/dev ou todo-infra/infra/envs/dev)
      - name: Detect Terraform working directory
        id: tfdir
        run: |
          set -euo pipefail
          echo "PWD=$(pwd)"
          echo "Listing root:"
          ls -la

          if [ -d "infra/envs/dev" ]; then
            echo "dir=infra/envs/dev" >> $GITHUB_OUTPUT
            echo "FOUND infra/envs/dev"
          elif [ -d "todo-infra/infra/envs/dev" ]; then
            echo "dir=todo-infra/infra/envs/dev" >> $GITHUB_OUTPUT
            echo "FOUND todo-infra/infra/envs/dev"
          else
            echo "Could not find infra/envs/dev in repo."
            echo "Directories (maxdepth 3):"
            find . -maxdepth 3 -type d | sed 's|^\./||'
            exit 1
          fi

      # (Opcional) Debug do diretório escolhido
      - name: Show Terraform directory contents
        run: |
          echo "Using TF dir: ${{ steps.tfdir.outputs.dir }}"
          ls -la "${{ steps.tfdir.outputs.dir }}"

      # ----- (se build/upload da Lambda pode ficar aqui se já estiver funcionando) -----
      # Se você já está fazendo build+upload do tasks.zip antes do apply, mantenha esses steps.

      - name: Terraform Init
        working-directory: ${{ steps.tfdir.outputs.dir }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ steps.tfdir.outputs.dir }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ${{ steps.tfdir.outputs.dir }}
        run: terraform apply -auto-approve
