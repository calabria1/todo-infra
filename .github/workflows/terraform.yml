name: Terraform Deploy (Infra + Lambda)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Debug folders (to find correct working directory)
        run: |
          echo "PWD=$(pwd)"
          echo "---- root ls ----"
          ls -la
          echo "---- find dirs (maxdepth 4) ----"
          find . -maxdepth 4 -type d | sed 's|^\./||'
          echo "---- check expected paths ----"
          [ -d "infra/envs/dev" ] && echo "FOUND: infra/envs/dev" || echo "MISSING: infra/envs/dev"
          [ -d "todo-infra/infra/envs/dev" ] && echo "FOUND: todo-infra/infra/envs/dev" || echo "MISSING: todo-infra/infra/envs/dev"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # ⚠️ Ajustado para o caso em que o repo tem uma pasta "todo-infra/" na raiz
      - name: Terraform Init
        working-directory: todo-infra/infra/envs/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: todo-infra/infra/envs/dev
        run: terraform plan

      - name: Terraform Apply
        working-directory: todo-infra/infra/envs/dev
        run: terraform apply -auto-approve
