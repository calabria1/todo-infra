name: Deploy Infrastructure + Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'todo-infra/infra/**'
      - 'services/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: todo-infra/infra/envs/dev

jobs:
  build-and-deploy:
    name: Build Lambda + Deploy Infra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Terraform variables
        id: tfvars
        run: |
          TFVARS_FILE="${{ env.TF_WORKING_DIR }}/terraform.tfvars"
          if [[ ! -f "${TFVARS_FILE}" ]]; then
            echo "terraform.tfvars not found at ${TFVARS_FILE}" >&2
            exit 1
          fi
          PROJECT=$(grep -E '^project' "${TFVARS_FILE}" | awk -F'=' '{print $2}' | tr -d ' "')
          ENVIRONMENT=$(grep -E '^env' "${TFVARS_FILE}" | awk -F'=' '{print $2}' | tr -d ' "')
          AWS_REGION=$(grep -E '^aws_region' "${TFVARS_FILE}" | awk -F'=' '{print $2}' | tr -d ' "')
          ARTIFACTS_BUCKET=$(grep -E '^artifacts_bucket' "${TFVARS_FILE}" | awk -F'=' '{print $2}' | tr -d ' "')
          {
            echo "project=${PROJECT}"
            echo "environment=${ENVIRONMENT}"
            echo "aws_region=${AWS_REGION}"
            echo "artifacts_bucket=${ARTIFACTS_BUCKET}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "AWS_REGION=${AWS_REGION}"
            echo "ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET}"
            echo "APP_NAME=${PROJECT}-${ENVIRONMENT}"
          } >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.tfvars.outputs.aws_region }}

      - name: Ensure artifacts bucket exists
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "${ARTIFACTS_BUCKET}" 2>/dev/null; then
            echo "Artifacts bucket already exists."
            exit 0
          fi

          echo "Creating artifacts bucket: ${ARTIFACTS_BUCKET}"
          aws s3api create-bucket \
            --bucket "${ARTIFACTS_BUCKET}" \
            --region "${AWS_REGION}" \
            --create-bucket-configuration "LocationConstraint=${AWS_REGION}"

          aws s3api put-public-access-block \
            --bucket "${ARTIFACTS_BUCKET}" \
            --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

          aws s3api put-bucket-versioning \
            --bucket "${ARTIFACTS_BUCKET}" \
            --versioning-configuration Status=Enabled

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Lambda package
        run: |
          chmod +x scripts/package_lambda.sh
          LAMBDA_SRC_DIR=services/tasks/src ZIP_PATH=build/tasks.zip scripts/package_lambda.sh

      - name: Upload Lambda to S3
        run: |
          ARTIFACT_VERSION="${GITHUB_SHA:0:7}"

          echo "Uploading build/tasks.zip as version: $ARTIFACT_VERSION"

          aws s3 cp build/tasks.zip \
            s3://${ARTIFACTS_BUCKET}/lambdas/tasks/${ARTIFACT_VERSION}.zip

          aws s3 cp build/tasks.zip \
            s3://${ARTIFACTS_BUCKET}/lambdas/tasks/latest.zip

          echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Import (artifacts bucket)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform import module.artifacts.aws_s3_bucket.this "${ARTIFACTS_BUCKET}"
          terraform import module.artifacts.aws_s3_bucket_public_access_block.this "${ARTIFACTS_BUCKET}"
          terraform import module.artifacts.aws_s3_bucket_versioning.this "${ARTIFACTS_BUCKET}"
          terraform import module.dynamodb.aws_dynamodb_table.this "${APP_NAME}-tasks"
          terraform import module.lambda_tasks.aws_iam_role.this "${APP_NAME}-tasks-role"
          terraform import module.lambda_tasks.aws_iam_role_policy.this "${APP_NAME}-tasks-role:${APP_NAME}-tasks-policy"
          set -e

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="lambda_artifact_version=$ARTIFACT_VERSION" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=== Deployment Complete ==="
          terraform output -json
