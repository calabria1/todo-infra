name: Destroy (dev)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DESTROY para confirmar'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  TF_WORKING_DIR: infra/envs/dev
  ARTIFACTS_BUCKET: todo-calabrial-artifacts-123

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmação inválida. Digite DESTROY."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # (opcional, mas evita destroy travar se bucket estiver no TF e cheio)
      - name: Empty artifacts bucket (best effort)
        run: |
          set +e
          aws s3 rm "s3://${{ env.ARTIFACTS_BUCKET }}" --recursive
          set -e

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Destroy (dev)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve
