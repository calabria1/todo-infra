name: Terraform Deploy (Infra + Lambda)

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ENV_DIR: "infra/envs/dev"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read api repo from tfvars
        id: apirepo
        run: |
          python - << 'PY'
          import re, pathlib
          p = pathlib.Path("infra/envs/dev/terraform.tfvars").read_text(encoding="utf-8")
          m = re.search(r'api_repo\s*=\s*"([^"]+)"', p)
          if not m:
            raise SystemExit("api_repo not found in infra/envs/dev/terraform.tfvars")
          print("api_repo=" + m.group(1))
          PY >> $GITHUB_OUTPUT

      - name: Clone API repo
        run: |
          git clone https://github.com/${{ steps.apirepo.outputs.api_repo }}.git api-src

      - name: Build lambda zip (tasks)
        working-directory: api-src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/tasks/requirements.txt -t .build/tasks
          mkdir -p .build/tasks/services/tasks/src
          cp -R services/tasks/src/* .build/tasks/services/tasks/src/
          cd .build/tasks
          zip -r ../../tasks.zip . >/dev/null
          echo "Built zip: $(pwd)/../../tasks.zip"

      - name: Upload lambda artifact to S3
        run: |
          ARTIFACT_VERSION="${GITHUB_SHA}"
          BUCKET=$(python - << 'PY'
          import re, pathlib
          p = pathlib.Path("infra/envs/dev/terraform.tfvars").read_text(encoding="utf-8")
          m = re.search(r'artifacts_bucket\s*=\s*"([^"]+)"', p)
          if not m:
            raise SystemExit("artifacts_bucket not found in tfvars")
          print(m.group(1))
          PY
          )
          aws s3 cp tasks.zip "s3://${BUCKET}/lambdas/tasks/${ARTIFACT_VERSION}.zip"

      - name: Terraform fmt
        working-directory: ${{ env.ENV_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.ENV_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.ENV_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.ENV_DIR }}
        run: terraform plan -var="lambda_artifact_version=${GITHUB_SHA}"

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.ENV_DIR }}
        run: terraform apply -auto-approve -var="lambda_artifact_version=${GITHUB_SHA}"
